schema_version: '6.1'
version: 1

tracked_files:
  claude_md:
    src: claude/CLAUDE.md
    dst: ~/.claude/CLAUDE.md
  vscode_settings:
    src: vscode/settings.json
    dst: "{{ vscode_user_dir }}/settings.json"
    template: true

marketplaces:
  official:
    source: github
    repo: anthropics/claude-plugins-official
  local-fork:
    source: path
    path: ~/dev/my-marketplace

claude_plugins:
  superpowers:
    marketplace: official
  bd-reference:
    marketplace: official

packages:
  superpowers:
    type: plugin
    plugin: superpowers
  bd-reference:
    type: plugin
    plugin: bd-reference
  ms-python.python:
    type: extension
    extension: ms-python.python
  rust-lang.rust-analyzer:
    type: extension
    extension: rust-lang.rust-analyzer

profiles:
  base:
    tracked_files:
      - claude_md
    packages:
      - superpowers
      - ms-python.python
    reconcile:
      extensions:
        policy: additive
    bootstrap:
      - ~/.claude/header.md

  child:
    extends: base
    tracked_files:
      - vscode_settings
    packages:
      - bd-reference
      - rust-lang.rust-analyzer
    reconcile:
      extensions:
        policy: prune
