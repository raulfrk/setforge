# E2E audit-and-prune verdict manifest.
#
# One [tests."<node-id>"] row per collected e2e_docker test node id, keyed by
# FULL node id (path::[Class::]func). Kept in lock-step with the real collected
# set by scripts/check_e2e_manifest.py (set-equality both directions + uniqueness
# + superseded-by-liveness + verb-smoke-coverage + fail-closed).
#
# Fields per row:
#   verdict  = keep | change | merge | delete | should-be-integration
#   smoke    = bool (true == carries a real @pytest.mark.smoke; golden path)
#   signal   = short why-string (what observable behavior the test pins)
#   verbs    = the setforge verb(s) / surface the test exercises
#   superseded_by = [node-ids] REQUIRED on delete/merge; names still-present
#                   sibling(s) that ASSERT the same observable behavior
#
# Boundary rule: Docker proves behavior that depends on a fresh host, a real
# executable/toolchain, a real TTY, POSIX metadata, or state shared across
# separate CLI processes. Portable parser/formatter/model behavior belongs in
# unit tests; CLI + temporary-filesystem orchestration belongs in integration.
#
# The first right-sizing pass removed 14 validate-formatting cases already
# covered below Docker and consolidated seven transition-schema cases into one
# persisted multi-process lifecycle. delete/merge verdicts, when present, still
# flag future work and require a live superseded_by target.

