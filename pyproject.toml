[project]
name = "setforge"
version = "0.3.0"
description = "Tracked-file + VSCode-extension + Claude-plugin orchestration CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Raul Farkas" }]
keywords = ["dotfiles", "vscode", "claude", "config", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "platformdirs>=4.0",
    "prompt_toolkit>=3.0.50",
    "jinja2>=3.1",
    "json-five>=1.1,<2",
    "rich>=13",
    "packaging>=21",
    "merge3>=0.0.16",
    "patiencediff>=0.2.18",
    "diff-match-patch>=20241021",
    "tomli-w>=1.0",
    "wcwidth>=0.2.13",
]

[project.urls]
Homepage = "https://github.com/raulfrk/setforge"
Source = "https://github.com/raulfrk/setforge"
Issues = "https://github.com/raulfrk/setforge/issues"
Changelog = "https://github.com/raulfrk/setforge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "mutmut==3.6.0",
    "mypy>=1.11",
    "pexpect>=4.9",
    "pyte>=0.8.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
]

[project.scripts]
setforge = "setforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["setforge"]
# Vendored shell completion templates under setforge/cli/completions/
# (_setforge / setforge.bash / setforge.fish) ship as package data so the
# importlib.resources fallback in setforge/cli/completion.py works when
# `setforge --show-completion=<shell>` fails (typer regression / binary
# missing / subprocess timeout / empty stdout). Hatchling picks them up
# automatically as non-Python files under a packaged directory; the empty
# __init__.py keeps them discoverable via importlib.resources.files().

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "ANN", "C901", "T20", "PTH"]
# ANN202 is a permanent ignore: project annotates public surface only (per CLAUDE.md).
ignore = [
    "ANN202",
]

[tool.ruff.lint.per-file-ignores]
# yaml_merge.py overlays ruamel.yaml CommentedMap / CommentedSeq / scalar
# trees at the YAML-document boundary. ruamel does not ship public-API
# type stubs, so the merge helpers accept and return `typing.Any`
# per the json-five-style untyped seam. Tightening to a union over
# ruamel's private node types would import third-party internals into
# our annotation surface without buying mypy coverage that callers can
# verify. ANN401 is the right per-file allow here.
"setforge/yaml_merge.py" = ["ANN401"]
# jsonc.py wraps json-five's untyped AST (model + lib_json). Same
# untyped-seam reasoning as yaml_merge.py: the third-party type surface
# is the constraint, not our annotation discipline.
"setforge/jsonc.py" = ["ANN401"]
# tests/ holds pytest fixture parameters (`monkeypatch`, `tmp_path`,
# `capsys`, …) whose types are obvious from naming and whose explicit
# annotation buys no daily reading clarity. ANN401 is also allowed
# here because tests construct ad-hoc dict / list scaffolds where
# `Any` is the only honest type. C901 is allowed because test code
# (especially binary-stub dispatch in tests/test_claude_plugins.py
# and the e2e Docker fixture in tests/docker/conftest.py) is
# naturally branchy by design; cyclomatic complexity is a
# production-code smell, not a test-quality signal. T20 (no print)
# is allowed because tests legitimately use `print` as a callable
# fixture for dispatch tests (see tests/cli/test_output_modes.py).
"tests/**" = ["ANN001", "ANN401", "C901", "T20"]
# scripts/ holds CLI utilities (e.g. release_preflight.py) that print
# status messages to stdout as part of their primary contract — they
# are tools, not library code. T20 (no print) does not apply.
"scripts/**" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess.run".msg = "Use `import subprocess` and call `subprocess.run(...)` — required for test monkeypatch path `setforge.<module>.subprocess.run` to resolve correctly."

[tool.ruff.lint.flake8-bugbear]
# Typer's ``Option`` / ``Argument`` are explicitly documented as
# function-default-call markers (the CLI parser detects them and rewrites
# the default at parse time). ruff's B008 normally flags this pattern as
# "do not perform function call in argument defaults"; bypass for the
# pair that the project depends on.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
markers = [
    "integration: cross-module verb integration tests (real git against a tmp source repo, mocked claude/code/gitleaks); runs in the default suite, no Docker",
    "test_infra: process-level tests of the test harness itself (opt-in; excluded from the fast default suite)",
    "e2e_docker: end-to-end Docker tests against a real Debian + claude + code container (opt-in via -m e2e_docker; not run by default)",
    "smoke: thin golden-path subset of the e2e_docker suite, run per-PR as a fast smoke split (select via -m 'e2e_docker and smoke')",
    "fresh_host: opt this test out of the autouse fresh-host suppression fixture so the install welcome gate fires",
    "xdist_group: serialize tagged tests to one xdist worker for daemon-bound resources (see tests/docker/conftest.py docker_daemon convention)",
]
# Default run skips Docker E2E and process-level test-infrastructure probes so
# plain `pytest` stays fast and docker-free. CI runs test_infra separately.
# --ignore=mutants keeps a leftover mutmut sandbox (gitignored mutants/, with its
# copied mutants/tests/) from breaking a local `uv run pytest` with an
# ImportPathMismatchError. (mutmut's own runs clear addopts via `-o addopts=`.)
addopts = "-m 'not e2e_docker and not test_infra' --strict-markers --cov=setforge --cov-branch --cov-report=term-missing --ignore=mutants"

[tool.coverage.run]
source = ["setforge"]
branch = true
omit = ["tests/*"]
# Required for pytest-xdist compatibility: each worker writes its own
# .coverage.<host>.<pid>.<random> file. Without this, pytest_configure_node
# fails with `AttributeError: 'Central' object has no attribute
# 'configure_node'` when --cov is active during -m e2e_docker runs (auto
# -n 2 via the conftest.py hook).
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:", "@(typing\\.)?overload"]

[tool.mutmut]
# Mutation testing over the merge/reconcile/store core — RFC §6's "real
# anti-change-detector measure". REPORT-BASELINE only: run it by hand
# (`uv run mutmut run || true; uv run mutmut results`), record the score in
# docs/mutation-baseline.md. It is NOT a gate and NOT in pre-commit — the
# `|| true` is mandatory because `mutmut run` exits nonzero on survivors.
# Enforcement (a >80% gate, CI diff-mode on PR + full nightly) is wired
# separately once the test audit-and-prune lands.
#
# source_paths must be the WHOLE package: mutmut copies these into a mutants/
# sandbox and runs the tests there, so the entire `setforge` package has to be
# present or the tests' imports break. Scoping mutation to just the core is
# done with `only_mutate` below — NOT by narrowing source_paths to files.
source_paths = ["setforge"]
# Copy the top-level scripts/ package into the sandbox too: a handful of unit
# tests (docs-sync / author-scaffold / dep-triage) `from scripts import ...`.
# mutmut already auto-copies tests/, pyproject.toml and setup.cfg; scripts/ is
# the only other tree the unit suite imports. (The root conftest.py holds no
# fixtures — only the e2e xdist activation/prebuild hooks — so it is
# intentionally not copied.)
also_copy = ["scripts"]
# Restrict which files actually get mutated to the merge/reconcile/store core
# (RFC §6). Everything else is copied (so imports resolve) but never mutated.
# (disposition_merge / section_reconcile were retired with the legacy
# disposition/sections subsystem; their entries + focused suites are gone below,
# so `mutmut run` collects a clean sandbox suite instead of aborting on a
# missing test file.)
only_mutate = [
    "setforge/markdown_merge.py",
    "setforge/scalar_merge.py",
    "setforge/structural_merge.py",
    "setforge/yaml_merge.py",
    "setforge/base_store.py",
    "setforge/base_store_format.py",
    "setforge/scalar_base_store.py",
]
# Scope the tests mutmut runs to the focused per-module unit suites for the
# core PLUS the two hermetic integration suites that drive the core through
# the real install/sync/compare/revert/stage verbs. Two reasons: (1) mutmut
# runs the suite from a mutants/ sandbox that only contains the copied trees,
# so any test that reads uncopied repo files (CHANGELOG.md, docs/, migrations)
# or needs uncopied structure fails and mutmut's own `-x` aborts the whole
# stats run; every entry here is sandbox-clean (tmp_path/in-memory data only).
# (2) They are the tests that actually kill core mutants. The two integration
# suites tighten the score: the merge/store core is reached via deploy.py /
# reconcile/ / transitions.py / stage.py, all exercised end-to-end by the
# install/sync/compare/revert/stage cases in test_verbs.py + test_smoke.py, so
# survivors that only an integration path kills are no longer FALSE survivors.
# Both integration suites are hermetic: the `integration_env` fixture (in the
# copied tests/integration/conftest.py) synthesizes the config repo under
# tmp_path, hardens git, and mocks claude/code/gitleaks behind the
# `integration_subprocess` no-leak guard. test_lockflow.py is deliberately
# EXCLUDED — it exercises the lock/provision path (setforge.provision.*), not
# the merge/store core, so it adds latency without kill power, and it runs the
# verbs without the `integration_subprocess` guard (unmocked real subprocess),
# which is fragile in the sandbox. See docs/mutation-baseline.md.
pytest_add_cli_args_test_selection = [
    "tests/test_markdown_merge.py",
    "tests/test_markdown_merge_segments.py",
    "tests/test_scalar_merge.py",
    "tests/test_structural_merge.py",
    "tests/test_structural_set_at_path.py",
    "tests/test_yaml_merge.py",
    "tests/test_base_store.py",
    "tests/test_base_store_format.py",
    "tests/test_scalar_base_store.py",
    "tests/integration/test_verbs.py",
    "tests/integration/test_smoke.py",
]
# Runner neutralization (load-bearing): mutmut shells out to pytest, which
# would otherwise inherit our default addopts (`--cov=setforge
# --cov-fail-under=85` + the conftest auto-xdist on e2e) and mis-score a mutant
# "killed" by the coverage gate firing instead of by an assertion. `-o addopts=`
# clears the inherited addopts entirely. mutmut adds its own `-x`.
pytest_add_cli_args = ["-o", "addopts="]

[tool.mypy]
# Aligned with [project].requires-python and [tool.ruff].target-version
# so PEP 695 type-parameter syntax (e.g. ``class Foo[T]:``) parses.
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true

# json5 (json-five on PyPI) ships ``py.typed`` but its public ``dumper``
# module exposes ``ModelDumper`` as a sibling of ``BaseDumper`` rather
# than a subclass, so the documented ``dumps(model, dumper=ModelDumper())``
# usage type-checks as an [arg-type] violation against the library's own
# annotations. Treat the json5 surface as the untyped seam that
# ``setforge.jsonc`` already documents (mirrors the per-file ``ANN401``
# allow under ``[tool.ruff.lint.per-file-ignores]``) so the wrapper's
# bug is not propagated into our error log.
[[tool.mypy.overrides]]
module = ["json5", "json5.*"]
follow_imports = "skip"

# diff-match-patch ships neither stubs nor a ``py.typed`` marker, so its
# ``match_main`` import is an [import-untyped] miss. The span relocation
# fuzzy stage uses a single, narrow surface (``match_main`` + two scalar
# threshold attrs); treat the module as the untyped seam rather than
# vendoring stubs for one call.
[[tool.mypy.overrides]]
module = ["diff_match_patch", "diff_match_patch.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pip-audit>=2.4",
    "pytest-subprocess>=1.5",
]
