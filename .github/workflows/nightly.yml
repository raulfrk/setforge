name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbox-full:
    name: Workbox trigger / full
    # GitHub records a job for the coordinator to poll without allocating a runner.
    if: github.event_name == 'workbox_poll_only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "The home CI coordinator verifies this default-branch run and dispatches all four nightly gates."
