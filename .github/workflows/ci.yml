name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workbox-unit:
    name: Workbox trigger / unit
    # GitHub records a job for the coordinator to poll without allocating a runner.
    if: github.event_name == 'workbox_poll_only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "The home CI coordinator verifies this run and dispatches the exact SetForge commit."

  workbox-supersede-unit:
    name: Workbox supersede / unit
    # Marker only: a newer commit may cancel this commit's older unit run.
    if: github.event_name == 'workbox_poll_only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Marker for the home CI coordinator; never executes."

  workbox-integration:
    name: Workbox trigger / integration
    if: github.event_name == 'workbox_poll_only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "The home CI coordinator verifies this pull request and dispatches its Docker and mutation checks."

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
